[project]
name = "intraday-watchtower"
version = "0.1.0"
description = "Local intraday A-share watchboard for sector strength, core stock attacks, and T+0 decision signals."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "httpx>=0.27",
  "easy-tdx>=1.20.6",
  "tushare>=1.4",
  "PyMySQL>=1.1",
]

[project.optional-dependencies]
dev = [
  "playwright>=1.50",
  "pytest>=8.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]

