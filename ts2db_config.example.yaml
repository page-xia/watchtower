# Copy this file to ts2db_config.yaml for local secrets.
# AppSettings reads ts2db_config.yaml by default, or WATCH_CONFIG_FILE if set.

# Tushare / EOD ingest
tushare_token: ""

# EOD 落库（本地 MySQL，库不存在时 ingest 自动创建）
db_config:
  db_type: mysql
  host: 127.0.0.1
  port: 3306
  db: watchtower_eod
  user: root
  pwd: ""

# Optional AI providers. The first non-empty provider wins.
cf_base_url: ""
cf_key: ""
cf_model_id: ""
deepseek-key: ""
zhipu_key: ""
bailian_key: ""
huoshan_key: ""

# Optional message ingest token
news_api_key: ""
message_ingest_token: ""
watch_ingest_token: ""
